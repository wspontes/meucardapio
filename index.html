<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cardápio Digital" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Rokkitt:wght@700&display=swap" rel="stylesheet" />
    <meta property="og:title" content="Cardápio Digital" />
    <meta property="og:description" content="A melhor opção da cidade" />
    <meta property="og:type" content="website" />
    <title>Cardápio Digital</title>
    <style>
      /* Tela de entrada: usa as cores já aplicadas pelo script abaixo. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--color-brand-black, #0a0a0a);
        color: var(--color-brand-white, #fafafa);
        font-family: system-ui, sans-serif;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--color-accent, #dc2626);
        color: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
      }
      .splash-mark::after {
        content: '';
        position: absolute;
        inset: -4px;
        border: 2px solid var(--color-accent, #dc2626);
        border-radius: 20px;
        animation: splash-pulse 1.5s ease-out infinite;
      }
      .splash-mark svg {
        width: 30px;
        height: 30px;
        animation: splash-float 1.5s ease-in-out infinite;
      }
      .splash-label {
        font-size: 11px;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--color-muted, #a3a3a3);
        animation: splash-fade 1.5s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0% { transform: scale(1); opacity: .7; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes splash-fade {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark::after,
        .splash-mark svg,
        .splash-label { animation: none; }
      }
    </style>
    <script>
      (function(){
        var s = document.documentElement.style;
        var slug = location.pathname.split('/').filter(Boolean)[0] || '';
        var cached = null;
        try {
          cached = JSON.parse(
            localStorage.getItem('meucardapio-theme-colors:' + slug) ||
            localStorage.getItem('meucardapio-theme-colors') ||
            'null'
          );
        } catch (e) {}

        if (!cached) {
          var t = localStorage.getItem('meucardapio-theme');
          var themes = {
            escuro:  { bb:'#0a0a0a', bw:'#fafafa', sf:'#1a1a1a', sh:'#262626', bd:'transparent', mt:'#a3a3a3', ac:'#dc2626', bt:'#dc2626' },
            claro:   { bb:'#f8f9fa', bw:'#1a1a1a', sf:'#ffffff', sh:'#f1f3f5', bd:'transparent', mt:'#868e96', ac:'#e03131', bt:'#e03131' },
            moderno: { bb:'#0f172a', bw:'#f1f5f9', sf:'#1e293b', sh:'#334155', bd:'transparent', mt:'#94a3b8', ac:'#38bdf8', bt:'#38bdf8' },
            elegante:{ bb:'#1a1410', bw:'#f5f0e8', sf:'#2a2218', sh:'#3a3028', bd:'transparent', mt:'#a89880', ac:'#d4a843', bt:'#d4a843' },
            vivo:    { bb:'#0a1a0f', bw:'#e8f5e9', sf:'#132a18', sh:'#1e3a24', bd:'transparent', mt:'#7fbf8f', ac:'#22c55e', bt:'#22c55e' }
          };
          cached = themes[t] || null;
        }
        if (!cached) return;

        var vars = {
          '--color-brand-black': cached.bb,
          '--color-brand-white': cached.bw,
          '--color-surface': cached.sf,
          '--color-surface-hover': cached.sh,
          '--color-border': cached.bd,
          '--color-muted': cached.mt,
          '--color-accent': cached.ac,
          '--color-button': cached.bt
        };
        Object.keys(vars).forEach(function(k){ if (vars[k]) s.setProperty(k, vars[k]); });
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app-splash" aria-hidden="true">
      <div class="splash-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 3v7a3 3 0 0 0 6 0V3" />
          <path d="M7 3v18" />
          <path d="M17 3c-2 2-3 5-3 8h4V3" />
          <path d="M18 11v10" />
        </svg>
      </div>
      <span class="splash-label">Carregando</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
